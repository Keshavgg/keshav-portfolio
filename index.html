    <!-- Google Fonts: Sofia Sans Condensed & Spline Sans Mono (Exact Ashmit Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Theme Initialization Script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kj_portfolio_theme');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && false)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- GitHub Pages SPA routing script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-[var(--bg-color)] text-[var(--text-color)] font-mono antialiased overflow-x-hidden selection:bg-[#101010] selection:text-white dark:selection:bg-white dark:selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
